# Contrastive training defaults shared by every gradient-trained model.
train:
  epochs: 10
  batch_size: 1024
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_steps: 500
  lr_floor: 0.01
  grad_clip: 1.0
  amp: true
  channel_dropout: 0.0
  log_every: 50
  eval_every: null            # steps; null = once per epoch
  eval_batch_size: 2048
  eval_max_events: null       # null = score every validation event
  monitor: val/top5_acc_subject_agg
  patience: 4                 # evaluations without improvement before stopping
  checkpoint_dir: null        # set to a persistent path to make the run resumable
loss:
  temperature: 0.07
  learn_temperature: true
  extra_negatives: 4096
  mse_weight: 0.0
